<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Drain Damage — Comics</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #102b29; }
    main { width: 100%; }
    img { display: block; width: 100%; height: auto; max-height: 100svh; object-fit: contain; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Drain Damage comics</h1>
    <img src="comic-shop-shelf-v1.png" width="1254" height="1254"
      alt="A comic book shop display with two rows of three issue spaces. Issue 01 is a black comic silhouette with Coming soon! written diagonally across it. The other five spaces are reserved for future issues.">
    <p class="sr-only">No issues are available to select yet.</p>
  </main>
</body>
</html>
