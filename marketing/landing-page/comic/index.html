<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Drain Damage — Comics</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #102b29; }
    main { position: relative; width: min(100vw, 100svh); }
    img { display: block; width: 100%; height: auto; max-height: 100svh; object-fit: contain; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
    .issue { position: absolute; left: 12.5199%; top: 29.9043%; width: 22.1691%; height: 25.5183%;
      background: #090b09; cursor: pointer; }
    .issue-cover { position: absolute; left: 11.5108%; top: 0; width: 76.7386%; height: 100%; object-fit: contain; }
    .preview-label { position: absolute; inset: 0; display: grid; place-items: center; background: #07100cd9;
      color: #fff0c5; opacity: 0; transition: opacity 150ms ease; pointer-events: none; }
    .preview-label span { transform: rotate(-20deg); font: italic bold clamp(12px, 4.5vmin, 40px)/1.1 Georgia, serif;
      text-align: center; text-shadow: 0 2px 3px #000; }
    .issue:hover .preview-label, .issue:focus-visible .preview-label { opacity: 1; }
    .issue:focus-visible { outline: 3px solid #ffd579; outline-offset: 2px; }
    @media (hover: none) {
      .preview-label { opacity: 1; top: auto; padding: 5px 2px; }
      .preview-label span { transform: none; font-size: clamp(11px, 3vw, 20px); }
    }
    @media (prefers-reduced-motion: reduce) { .preview-label { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Drain Damage comics</h1>
    <img src="comic-shop-shelf-v1.png" width="1254" height="1254"
      alt="A comic book shop display with two rows of three issue spaces. The Issue 01 cover occupies the top-left space. The other five spaces are reserved for future issues.">
    <a class="issue" href="issue-01/" aria-label="Issue 01: partial work-in-progress preview. Open download directory.">
      <img class="issue-cover" src="issue-01-cover-v5.png" width="1024" height="1536" alt="">
      <div class="preview-label" aria-hidden="true"><span>Preview<br>PDF</span></div>
    </a>
    <p class="sr-only">Issue 01 is a partial work-in-progress preview available for proofreading.</p>
  </main>
</body>
</html>
